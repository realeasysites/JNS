<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login – Jalbert n' Sons</title><meta name="robots" content="noindex">
<style>body{font-family:system-ui,sans-serif;background:#1f2d24;display:grid;place-items:center;min-height:100vh;margin:0}
form{background:#fbf7ef;padding:32px;border-radius:12px;width:min(340px,90vw);box-shadow:0 20px 50px #0006}
h1{font-size:20px;margin:0 0 16px;color:#1f2d24}input,button{width:100%;padding:12px;font-size:16px;border-radius:8px;border:1px solid #c9bfa9;box-sizing:border-box}
button{background:#b5651d;color:#fff;border:0;margin-top:12px;font-weight:700;cursor:pointer}.e{color:#a22;font-size:14px;display:none}</style></head>
<body><form method="post" action="/admin/login"><h1>Jalbert n' Sons – Leads</h1>
<p class="e" id="e">Wrong password.</p><input type="password" name="password" placeholder="Password" autofocus required><button>Log in</button></form>
<script>if(location.search.includes('error'))document.getElementById('e').style.display='block'</script></body></html>
